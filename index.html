   AUTH (localStorage MVP — Prototyp, kein echtes Backend)
   ============================================================ */
const AUTH_KEY = 'feminity_users';
const SESSION_KEY = 'feminity_session';
const TIER_THRESHOLDS = [
  { tier:'PLATINUM', points:3000, label:'Platinum' },
  { tier:'GOLD',     points:1500, label:'Gold' },
  { tier:'SILVER',   points:500,  label:'Silver' },
  { tier:'BRONZE',   points:0,    label:'Bronze' },
];
function tierFromPoints(p){
  return TIER_THRESHOLDS.find(t => p >= t.points).tier;
}
function nextTier(p){
  for(let i=TIER_THRESHOLDS.length-1; i>=0; i--){
    if(p < TIER_THRESHOLDS[i].points) return TIER_THRESHOLDS[i];
  }
  return null;
}
// Birthday Bonus: 3 days before birthday until birthday (inclusive)
function birthdayBonusStatus(birthday, today = new Date()){
  if(!birthday) return null;
  const parts = birthday.split('-').map(Number);
  if(parts.length < 3 || !parts[0] || !parts[1] || !parts[2]) return null;
  const m = parts[1], d = parts[2];
  const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let bd = new Date(now.getFullYear(), m-1, d);
  let diffDays = Math.round((bd - now) / 86400000);
  if(diffDays < 0){
    bd = new Date(now.getFullYear()+1, m-1, d);
    diffDays = Math.round((bd - now) / 86400000);
  }
  return { eligible: diffDays >= 0 && diffDays <= 3, daysUntil: diffDays, year: bd.getFullYear() };
}
function loadUsers(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)||'[]'); } catch { return []; } }
function saveUsers(u){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(u)); } catch {} }
function loadSession(){ try { return localStorage.getItem(SESSION_KEY); } catch { return null; } }
function saveSession(e){ try { localStorage.setItem(SESSION_KEY, e); } catch {} }
function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch {} }

function useAuth(){
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    const email = loadSession();
    if(email){
      const u = loadUsers().find(x => x.email === email);
      if(u) setUser(u);
    }
    setLoading(false);
  }, []);

  function register(data){
    const users = loadUsers();
    if(users.find(u => u.email.toLowerCase() === data.email.toLowerCase())){
      return { ok:false, error:'Diese E-Mail ist bereits registriert.' };
    }
    if(!data.password || data.password.length < 6){
      return { ok:false, error:'Passwort muss mindestens 6 Zeichen lang sein.' };
    }
    const newUser = {
      name: data.name.trim(),
      email: data.email.trim().toLowerCase(),
      password: data.password,
      birthday: data.birthday || '',
      stylePref: data.stylePref || '',
      joinedAt: Date.now(),
      photo: '',
      loyaltyPoints: 100,
      tier: 'BRONZE',
      upcoming: [],
      history: [],
      passport: [],
      completedMatches: 0,
      lastMatch: null,
    };
    newUser.tier = tierFromPoints(newUser.loyaltyPoints);
    users.push(newUser);
    saveUsers(users);
    saveSession(newUser.email);
    setUser(newUser);
    return { ok:true };
  }

  function login(email, password){
    const u = loadUsers().find(x => x.email.toLowerCase() === email.trim().toLowerCase() && x.password === password);
    if(!u) return { ok:false, error:'E-Mail oder Passwort stimmt nicht.' };
    saveSession(u.email);
    setUser(u);
    return { ok:true };
  }

  function logout(){
    clearSession();
    setUser(null);
  }

  function updateUser(updates){
    if(!user) return;
    const users = loadUsers();
    const idx = users.findIndex(x => x.email === user.email);
    if(idx === -1) return;
    const updated = { ...users[idx], ...updates };
    updated.tier = tierFromPoints(updated.loyaltyPoints);
    users[idx] = updated;
    saveUsers(users);
    setUser(updated);
  }

  function addPoints(amount, reason){
    if(!user) return;
    updateUser({ loyaltyPoints: user.loyaltyPoints + amount });
  }

  return { user, loading, register, login, logout, updateUser, addPoints };
}

function LoginPage({ setView, auth }){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  function submit(e){
    e.preventDefault();
    const r = auth.login(email, password);

  return (

          <FormField label="Passwort" type="password" value={password} onChange={e=>setPassword(e.target.value)} required autoComplete="current-password" />

                  <div className="font-medium">Beliebige Stylistin</div>
                  <div className="text-xs text-ink-600 mt-1">Schnellster Termin verfügbar</div>
                </button>
                {STAFF.map(s=>{
                  const qualified = picked.length===0 || picked.every(pid=>SERVICES.find(sv=>sv.id===pid)?.staff.includes(s.id));
                  return (
                    <button key={s.id} disabled={!qualified} onClick={()=>setStaff(s.id)}
                      className={`p-4 rounded-2xl border text-left transition ${staff===s.id?'border-ink-900 bg-champagne-100':'border-champagne-200'} ${!qualified?'opacity-40 cursor-not-allowed':''}`}>
                      {s.photo
                        ? <img src={s.photo} alt={s.name} className="w-12 h-12 rounded-full object-cover mb-3" />
                        : <div className="w-12 h-12 rounded-full bg-gradient-to-br from-rose-200 to-champagne-300 grid place-items-center font-display text-lg text-ink-700 mb-3">{s.name[0]}</div>}
                      <div className="font-medium">{s.name}</div>
                      <div className="text-xs text-ink-600 mt-1">{s.tag}</div>
                      {!qualified && <div className="text-xs text-amber-700 mt-1">Erbringt diese Leistung nicht</div>}
                    </button>
                  );
                })}
              </div>
            </Card>
          )}

          {step===3 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Datum und Uhrzeit</h3>
              <div className="flex gap-2 overflow-x-auto scroll-hidden pb-2">
                {Array.from({length:14}).map((_,i)=>{
                  const d = new Date(2026,4,1+i);
                  const iso = d.toISOString().slice(0,10);
                  const lbl = d.toLocaleDateString('de-DE',{weekday:'short', day:'2-digit', month:'short'});
                  return (
                    <button key={iso} onClick={()=>setDate(iso)} className={`px-4 py-3 rounded-2xl border text-sm whitespace-nowrap ${date===iso?'border-ink-900 bg-ink-900 text-champagne-50':'border-champagne-200'}`}>{lbl}</button>
                  );
                })}
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-5">
                {SLOTS.map(t=>(
                  <button key={t} onClick={()=>setTime(t)} className={`px-3 py-2.5 rounded-xl border text-sm ${time===t?'border-ink-900 bg-ink-900 text-champagne-50':'border-champagne-200 hover:bg-champagne-100'}`}>{t}</button>
                ))}
              </div>
              <div className="text-xs text-ink-600 mt-4">Verfügbarkeit synchronisiert mit Treatwell und internem Kalender.</div>
            </Card>
          )}

          {step===4 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Deine Daten</h3>
              <div className="space-y-3">
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="Name" value={customer.name} onChange={e=>setCustomer({...customer,name:e.target.value})} />
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="E-Mail" type="email" value={customer.email} onChange={e=>setCustomer({...customer,email:e.target.value})} />
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="Telefon (für WhatsApp-Erinnerung)" value={customer.phone} onChange={e=>setCustomer({...customer,phone:e.target.value})} />
                <label className="flex items-start gap-2 text-sm text-ink-700 mt-3">
                  <input type="checkbox" className="mt-1" required /> Ich akzeptiere Datenschutzerklärung und AGB.
                </label>
                <label className="flex items-start gap-2 text-sm text-ink-700">
                  <input type="checkbox" className="mt-1" /> Ich möchte WhatsApp-Erinnerungen erhalten.
                </label>
              </div>
            </Card>
          )}

          {step===5 && requiresForm && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-2">Aufklärungsbogen</h3>
              <p className="text-sm text-ink-700">Für die gewählte Leistung ist eine Aufklärung erforderlich. Bitte beantworte die folgenden Fragen vor deinem Termin.</p>
              <div className="mt-5 space-y-4">
                {[
                  'Hast du bekannte Allergien gegen kosmetische Wirkstoffe?',
                  'Bist du aktuell schwanger oder stillst du?',
                  'Hattest du in den letzten 6 Monaten eine Henna-Behandlung?',
                  'Nimmst du blutverdünnende Medikamente?'
                ].map((q,i)=>(
                  <div key={i} className="p-4 rounded-2xl bg-champagne-50">
                    <div className="text-sm font-medium">{q}</div>
                    <div className="flex gap-2 mt-2">
                      <button className="px-4 py-1.5 rounded-full text-xs bg-white border border-champagne-200">Ja</button>
                      <button className="px-4 py-1.5 rounded-full text-xs bg-white border border-champagne-200">Nein</button>
                    </div>
                  </div>
                ))}
                <div className="p-4 rounded-2xl border-2 border-dashed border-champagne-300 text-center text-sm text-ink-600">
                  Hier digital unterschreiben
                </div>
                <label className="flex items-start gap-2 text-sm">
                  <input type="checkbox" className="mt-1" checked={formAccepted} onChange={e=>setFormAccepted(e.target.checked)} />
                  Ich bestätige die wahrheitsgemäße Beantwortung und stimme der Behandlung zu.
                </label>
              </div>
            </Card>
          )}

          {step===steps.length && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Zusammenfassung</h3>
              <div className="space-y-3 text-sm">
                <Row label="Leistung" value={picked.map(id=>SERVICES.find(s=>s.id===id)?.name).join(', ')} />
                <Row label="Stylistin" value={staff==='any'?'beliebige':STAFF.find(s=>s.id===staff)?.name} />
                <Row label="Datum" value={`${date} um ${time||'—'}`} />
                <Row label="Dauer" value={minToHrs(totalDuration)} />
                <Row label="Aufklärungsbogen" value={requiresForm?(formAccepted?'unterzeichnet':'fehlt'):'—'} />
                <div className="border-t border-champagne-200 pt-3 flex items-center justify-between">
                  <div className="font-medium">Gesamt</div>
                  <div className="font-display text-2xl">{hasFromPrice?'ab ':''}{fmt(totalPrice)}</div>
                </div>
              </div>
            </Card>
          )}

          <div className="flex justify-between">
            <Button variant="ghost" onClick={()=>step>1?setStep(step-1):setView('services')}>Zurück</Button>
            {step<steps.length ? (
              <Button onClick={()=>setStep(step+1)} disabled={
                (step===1 && picked.length===0) ||
                (step===3 && !time) ||
                (step===4 && (!customer.name||!customer.email)) ||
                (step===5 && requiresForm && !formAccepted)
              }>Weiter</Button>
            ) : (
              <Button variant="rose" onClick={()=>setConfirmed(true)}>Verbindlich buchen</Button>
            )}
          </div>
        </div>

        <aside className="md:sticky md:top-24 self-start">
          <Card className="p-6">
            <div className="text-xs uppercase tracking-widest text-ink-600">Deine Auswahl</div>
            {picked.length===0 && <p className="text-sm text-ink-600 mt-3">Noch keine Leistung gewählt.</p>}
            <div className="space-y-2 mt-3">
              {picked.map(id=>{ const s=SERVICES.find(s=>s.id===id); return (
                <div key={id} className="flex justify-between text-sm">
                  <span>{s.name}</span><span className="text-ink-600">{minToHrs(s.duration)}</span>
                </div>
              ); })}
            </div>
            {picked.length>0 && (
              <div className="border-t border-champagne-100 mt-4 pt-4 text-sm">
                <div className="flex justify-between"><span>Dauer</span><span>{minToHrs(totalDuration)}</span></div>
                <div className="flex justify-between mt-1"><span>Gesamt</span><span className="font-display text-lg">{hasFromPrice?'ab ':''}{fmt(totalPrice)}</span></div>
              </div>
            )}
          </Card>
        </aside>
      </div>
    </Section>
  );
}

function Row({label, value}){ return <div className="flex justify-between"><span className="text-ink-600">{label}</span><span className="font-medium">{value}</span></div>; }

/* ============================================================

   ============================================================ */
const MATCH_QUESTIONS = [
  // Look-Match
  { id:'L1', section:'Look', q:'Was ist dein Ziel?', opts:[
    'Natürlich frischer aussehen','Glamour','Business Look','Event / Hochzeit',

  ]},

  ]},
  // Hair-Match
  { id:'H1', section:'Hair', q:'Wie lang ist dein Haar?', opts:[

  ]},
  { id:'H4', section:'Hair', q:'Aktuelle Farbe / Behandlung', opts:[

  ]},
  { id:'H5', section:'Hair', q:'Wie viel Pflegeaufwand zu Hause magst du?', opts:[
    'Minimal (5 min)','Moderat (10–15 min)','Aufwändig (>20 min)','Lieber im Salon'
  ]},
  { id:'H6', section:'Hair', q:'Was wünschst du dir konkret?', multi:true, opts:[
    'Schnitt','Farbe','Pflege / Treatment','Styling','Glossing','Extensions','Keratin'
  ]},
  // Beauty-Match
  { id:'B1', section:'Beauty', q:'Was stört dich aktuell an deiner Haut?', multi:true, opts:[
    'Müde Haut','Unreinheiten','Trockenheit','Pigmentflecken','Falten',
    'Augenringe','Glow fehlt','Brows','Lashes'
  ]},
  { id:'B2', section:'Beauty', q:'Wann willst du gut aussehen?', opts:[
    'Heute','Diese Woche','In 4 Wochen','Vor einem Event','Dauerhaft'
  ]},
  { id:'B3', section:'Beauty', q:'Wie ist dein Hauttyp?', opts:[
    'Normal','Trocken','Mischhaut','Sensibel','Reife Haut'
  ]},
  // Frame
  { id:'F1', section:'Rahmen', q:'Welches Budget hast du für diesen Termin?', opts:[
    'bis 100 €','100–250 €','250–500 €','offen'
  ]},
  { id:'F2', section:'Rahmen', q:'Wie viel Zeit kannst du dir nehmen?', opts:[
    'unter 1 h','1–2 h','2–4 h','flexibel'
  ]},
];

const MATCH_TYPES = {
  daily:       { key:'daily',       label:'Daily Beauty Match',       sub:'Alltagstauglich, gepflegt, natürlich' },
  signature:   { key:'signature',   label:'Signature Feminity Match', sub:'Sichtbar hochwertig — bewusst gewählt' },
  transform:   { key:'transform',   label:'Transformation Match',     sub:'Größere Veränderung, neuer Look' },
};

function computeMatch(a){
  // Match-Type aus L2
  let mt = MATCH_TYPES.daily;
  if(a.L2==='Sichtbar' || a.L2==='Mutig') mt = MATCH_TYPES.signature;
  if(a.L2==='Komplette Transformation') mt = MATCH_TYPES.transform;

  // Look-Name aus L1 + Match-Type
  let lookKey = 'daily_natural';
  if(a.L1==='Glamour') lookKey = 'signature_glam';
  else if(a.L1==='Business Look') lookKey = 'daily_business';
  else if(a.L1==='Event / Hochzeit') lookKey = mt===MATCH_TYPES.transform ? 'bridal' : 'signature_event';
  else if(a.L1==='Haarrettung') lookKey = 'repair_focus';
  else if(a.L1==='Anti-Aging' || a.L1==='Hautbild verbessern') lookKey = 'glow_boost';
  else if(mt===MATCH_TYPES.transform) lookKey = a.H4==='Coloriert'||a.H4==='Blondiert'?'transform_color':'transform_full';

  // Score services across answers
  const wishes = a.H6 || [];
  const concerns = a.B1 || [];
  const traits = a.L3 || [];
  const conditions = a.H3 || [];

  const score = (s)=>{
    let p = 0;
    // L1 goal
    if(a.L1==='Haarrettung' && (s.id==='svc-treatment'||s.id==='svc-curl'||s.id==='svc-glossing')) p += 30;
    if(a.L1==='Glamour' && (s.id==='svc-makeup'||s.id==='svc-balayage'||s.id==='svc-lash')) p += 25;
    if(a.L1==='Event / Hochzeit' && (s.id==='svc-makeup'||s.id==='svc-balayage'||s.id==='svc-brows'||s.id==='svc-lash'||s.id==='svc-bridal')) p += 25;
    if(a.L1==='Event / Hochzeit' && s.id==='svc-bridal') p += 20;
    if(a.L1==='Anti-Aging' && (s.id==='svc-skin'||s.id==='svc-greenpeel'||s.id==='svc-nad'||s.id==='svc-apparative')) p += 30;
    if(a.L1==='Hautbild verbessern' && (s.id==='svc-skin'||s.id==='svc-greenpeel'||s.id==='svc-consult'||s.id==='svc-natural'||s.id==='svc-apparative')) p += 30;
    if(a.L1==='Business Look' && (s.id==='svc-cut-classic'||s.id==='svc-glossing'||s.id==='svc-brows')) p += 20;
    if(a.L1==='Natürlich frischer aussehen' && (s.id==='svc-glossing'||s.id==='svc-skin'||s.id==='svc-brows'||s.id==='svc-treatment'||s.id==='svc-natural')) p += 20;

    // Hair wishes
    if(wishes.includes('Schnitt') && s.id==='svc-cut-classic') p += 25;
    if(wishes.includes('Farbe') && (s.id==='svc-color'||s.id==='svc-balayage')) p += 25;
    if(wishes.includes('Pflege / Treatment') && s.id==='svc-treatment') p += 30;
    if(wishes.includes('Styling') && (s.id==='svc-cut-classic'||s.id==='svc-makeup')) p += 10;
    if(wishes.includes('Glossing') && s.id==='svc-glossing') p += 35;
    if(wishes.includes('Extensions') && s.id==='svc-extensions') p += 40;

    // Hair condition
    if(conditions.includes('Trocken')||conditions.includes('Brüchig')||conditions.includes('Spliss')){
      if(s.id==='svc-treatment') p += 25;
      if(s.id==='svc-glossing') p += 10;
    }
    if(a.H4==='Blondiert' && (s.id==='svc-treatment'||s.id==='svc-glossing')) p += 15;

    // Beauty concerns
    if(concerns.includes('Glow fehlt')||concerns.includes('Müde Haut')){ if(s.id==='svc-skin'||s.id==='svc-nad'||s.id==='svc-apparative') p += 25; }
    if(concerns.includes('Unreinheiten')||concerns.includes('Pigmentflecken')){ if(s.id==='svc-greenpeel'||s.id==='svc-apparative') p += 30; }
    if(concerns.includes('Falten')||concerns.includes('Augenringe')){ if(s.id==='svc-skin'||s.id==='svc-nad'||s.id==='svc-apparative') p += 20; }
    if(concerns.includes('Brows')){ if(s.id==='svc-brows'||s.id==='svc-pmu') p += 35; }
    if(concerns.includes('Lashes')){ if(s.id==='svc-lash') p += 40; }
    if(concerns.includes('Trockenheit')){ if(s.id==='svc-skin'||s.id==='svc-natural') p += 20; }
    if(traits.includes('Natürlich') && s.id==='svc-natural') p += 15;

    // Style traits
    if(traits.includes('Luxuriös') && s.signature) p += 8;
    if(traits.includes('Low Maintenance') && (s.id==='svc-glossing'||s.id==='svc-pmu'||s.id==='svc-lash')) p += 15;

    // Time fit
    if(a.F2==='unter 1 h' && s.duration<=60) p += 5;
    if(a.F2==='1–2 h' && s.duration>60 && s.duration<=120) p += 5;
    if(a.F2==='2–4 h' && s.duration>120 && s.duration<=240) p += 5;
    if(a.F2==='flexibel') p += 3;

    // Budget fit
    if(a.F1==='bis 100 €' && s.price<=10000) p += 5;
    if(a.F1==='100–250 €' && s.price>10000 && s.price<=25000) p += 5;
    if(a.F1==='250–500 €' && s.price>25000 && s.price<=50000) p += 5;
    if(a.F1==='offen') p += 3;

    return p;
  };

  const ranked = SERVICES.map(s=>({ s, p:score(s) }))
    .filter(x=>x.p>0).sort((x,y)=>y.p-x.p);
  const maxP = ranked[0]?.p || 1;
  const treatments = ranked.slice(0, mt===MATCH_TYPES.transform?5:4)
    .map(x=>({ ...x.s, matchPct: Math.min(99, Math.round(40 + (x.p/maxP)*55)) }));

  // Team-Match
  const teamScore = (st)=>{
    let p = 0;
    const hairTreatments = treatments.filter(t=>t.area==='HAIR');
    const beautyTreatments = treatments.filter(t=>t.area==='BEAUTY');
    const facialConcerns = concerns.some(c=>['Müde Haut','Unreinheiten','Trockenheit','Pigmentflecken','Falten','Augenringe','Glow fehlt'].includes(c));
    const isWedding = a.L1==='Event / Hochzeit';
    const isGlamour = a.L1==='Glamour';
    const isSignatureOrTransform = mt!==MATCH_TYPES.daily;

    // Beauty
    if(beautyTreatments.length && st.id==='jule') p += 45;
    if(beautyTreatments.length && st.id==='cosmina'){
      p += 30;
      if(facialConcerns) p += 25;
      if(traits.includes('Natürlich')||traits.includes('Clean')) p += 15;
      if(treatments.some(t=>t.id==='svc-apparative'||t.id==='svc-natural'||t.id==='svc-greenpeel')) p += 20;
    }

    // Hair
    if(hairTreatments.length){
      if(st.id==='nicky') p += 30;
      if((a.H4==='Blondiert'||wishes.includes('Farbe')||isGlamour) && st.id==='nicky') p += 20;
      if(wishes.includes('Extensions') && st.id==='zahra') p += 50;
      if(a.H2==='Kraus'||a.H2==='African Hair'){ if(st.id==='nicky'||st.id==='zahra') p += 15; }
      if(wishes.includes('Schnitt') && hairTreatments.length===1 && a.L2==='Minimal'){ if(st.id==='esra') p += 25; }
      if(a.H4==='Coloriert' && st.id==='zahra') p += 10;
      if(st.id==='evelyn'){
        p += 15;
        if(wishes.includes('Farbe')||a.H4==='Blondiert') p += 20;
        if(treatments.some(t=>t.id==='svc-balayage')) p += 15;
      }
    }

    // Wedding/Glamour: Evelyn excels at all-in-one
    if((isWedding||isGlamour) && st.id==='evelyn'){
      p += 30;
      if(treatments.some(t=>t.id==='svc-bridal'||t.id==='svc-makeup')) p += 20;
    }

    // Signature/Transformation tilts toward senior team
    if(isSignatureOrTransform && (st.id==='nicky'||st.id==='evelyn'||st.id==='zahra'||st.id==='cosmina'||st.id==='jule')) p += 5;

    return p;
  };
  const teamRanked = STAFF.map(st=>({ st, p:teamScore(st) }))
    .filter(x=>x.p>0).sort((x,y)=>y.p-x.p).map(x=>x.st);
  const team = teamRanked.slice(0,2);

  // Why-Sentences
  const teamReason = (st)=>{
    const reasons = [];
    if(st.id==='jule') reasons.push('für deine Beauty-Themen, die individuelle Beratung verlangen');
    if(st.id==='nicky') reasons.push('weil du eine sichtbare, hochwertige Veränderung suchst');
    if(st.id==='zahra' && wishes.includes('Extensions')) reasons.push('weil sie Extensions-Expertin ist');
    if(st.id==='zahra' && (a.H2==='Kraus'||a.H2==='African Hair')) reasons.push('weil sie alle Haartypen tief versteht');
    if(st.id==='zahra' && reasons.length===0) reasons.push('weil sie alle Schnitte und Colorationen souverän umsetzt');
    if(st.id==='esra') reasons.push('weil sie sehr einfühlsam an deinen individuellen Stil herangeht');
    if(st.id==='cosmina'){
      if(treatments.some(t=>t.id==='svc-natural')) reasons.push('weil ihre Naturkosmetik-Expertise perfekt zu deinem Wunsch passt');
      else if(treatments.some(t=>t.id==='svc-apparative')) reasons.push('weil sie apparative Kosmetik gezielt einsetzt');
      else reasons.push('weil sie Gesichtsbehandlungen mit Wissen und Geduld führt');
    }
    if(st.id==='evelyn'){
      if(a.L1==='Event / Hochzeit') reasons.push('weil sie Hair und Make-up für Hochzeiten als ein Gesamtwerk denkt');
      else if(treatments.some(t=>t.id==='svc-balayage')) reasons.push('weil sie als Balayage-Künstlerin handgemalte Highlights setzt');
      else reasons.push('weil sie Hair und Beauty in einer Hand vereint — Salon bis Runway');
    }
    return reasons[0] || 'weil ihre Specialties zu deinem Match passen';
  };

  // Home-Routine
  let homeKey = 'beauty_glow';
  const isBeautyHeavy = treatments.filter(t=>t.area==='BEAUTY').length >= treatments.filter(t=>t.area==='HAIR').length;
  if(isBeautyHeavy){
    homeKey = (a.B3==='Reife Haut'||concerns.includes('Falten')||concerns.includes('Augenringe')) ? 'beauty_repair' : 'beauty_glow';
  } else {
    if(a.H2==='Lockig'||a.H2==='Kraus'||a.H2==='African Hair') homeKey = 'hair_curl';
    else if(a.H4==='Coloriert'||a.H4==='Blondiert'||a.H4==='Highlights') homeKey = 'hair_color';
    else if(conditions.includes('Trocken')||conditions.includes('Brüchig')||conditions.includes('Spliss')) homeKey = 'hair_repair';
    else homeKey = 'hair_minimal';
  }
  const routine = HOME_ROUTINES[homeKey];

  // Totals
  const totalDuration = treatments.reduce((sum,t)=>sum+t.duration, 0);
  const totalPrice = treatments.reduce((sum,t)=>sum+t.price, 0);

  return {
    matchType: mt,
    lookName: LOOK_NAMES[lookKey],
    treatments,
    team,
    teamReason,
    routine,
    totalDuration,
    totalPrice,
    answers: a,
  };
}

function BeautyMatch({ setView, auth }){
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [done, setDone] = useState(false);
  const [savedMatch, setSavedMatch] = useState(null);
  const [copyHint, setCopyHint] = useState('');
  const [pointsEarned, setPointsEarned] = useState(0);

  // Load saved match on mount
  useEffect(()=>{
    try {
      const raw = localStorage.getItem('feminity_match');
      if(raw) setSavedMatch(JSON.parse(raw));
    } catch {}
  },[]);

  const totalQuestions = MATCH_QUESTIONS.length;
  const currentQ = MATCH_QUESTIONS[step];
  const sectionIdx = ['Look','Hair','Beauty','Rahmen'].indexOf(currentQ?.section);
  const progress = Math.round(((step) / totalQuestions) * 100);

  const result = useMemo(()=> done ? computeMatch(answers) : null, [done, answers]);

  function selectSingle(opt){
    const next = { ...answers, [currentQ.id]: opt };
    setAnswers(next);
    if(step+1 >= totalQuestions){
      finalize(next);
    } else {
      setStep(step+1);
    }
  }
  function toggleMulti(opt){
    const cur = Array.isArray(answers[currentQ.id]) ? answers[currentQ.id] : [];
    const next = cur.includes(opt) ? cur.filter(x=>x!==opt) : [...cur, opt];
    setAnswers({ ...answers, [currentQ.id]: next });
  }
  function nextMulti(){
    if(step+1 >= totalQuestions) finalize(answers);
    else setStep(step+1);
  }
  function finalize(allAnswers){
    setDone(true);
    try {
      const m = computeMatch(allAnswers);
      localStorage.setItem('feminity_match', JSON.stringify({ answers:allAnswers, lookName:m.lookName, ts:Date.now() }));
      setSavedMatch({ answers:allAnswers, lookName:m.lookName, ts:Date.now() });
    } catch {}
    // Award 50 Beauty Points for completing the match (only first time per session)
    if(auth?.user && pointsEarned === 0){
      const m = computeMatch(allAnswers);
      auth.updateUser({
        loyaltyPoints: auth.user.loyaltyPoints + 50,
        completedMatches: (auth.user.completedMatches || 0) + 1,
        lastMatch: { lookName: m.lookName, ts: Date.now() },
      });
      setPointsEarned(50);
    }
  }
  function reset(){
    setAnswers({}); setStep(0); setDone(false);
    try { localStorage.removeItem('feminity_match'); } catch {}
    setSavedMatch(null);
  }
  function viewSavedMatch(){
    if(savedMatch){ setAnswers(savedMatch.answers); setDone(true); }
  }
  function shareWhatsApp(){
    const txt = `Mein Feminity Beautymatch: ${result.lookName} (${result.matchType.label}). Schau es dir an: https://ruetherkoeln.github.io/feminity-app/`;
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
  }
  function copyLink(){
    navigator.clipboard?.writeText('https://ruetherkoeln.github.io/feminity-app/').then(()=>{
      setCopyHint('Link kopiert!');
      setTimeout(()=>setCopyHint(''), 2000);
    });
  }

  // Quiz-Ansicht
  if(!done){
    const isMulti = !!currentQ.multi;
    const selected = isMulti ? (answers[currentQ.id]||[]) : answers[currentQ.id];

    return (
      <Section className="py-12 max-w-3xl mx-auto">
        <div className="text-xs uppercase tracking-[0.3em] text-rose-500">Beautymatch</div>
        <h1 className="font-display text-5xl text-ink-900 mt-2">Finde deinen Signature Look</h1>
        <p className="text-ink-700 mt-4 max-w-xl">Finde deinen perfekten Hair- &amp; Beauty-Look — passend zu deinem Typ, deinem Alltag und deinem Anlass.</p>

        {savedMatch && step===0 && Object.keys(answers).length===0 && (
          <Card className="p-4 mt-6 flex items-center justify-between gap-4 bg-champagne-50">
            <div className="text-sm">
              <div className="font-medium">Letztes Match: {savedMatch.lookName}</div>
              <div className="text-ink-600 text-xs mt-0.5">{new Date(savedMatch.ts).toLocaleDateString('de-DE')}</div>
            </div>
            <Button size="sm" variant="soft" onClick={viewSavedMatch}>Anzeigen</Button>
          </Card>
        )}

        <Card className="p-8 mt-8">
          {/* Progress */}
          <div className="flex items-center justify-between text-xs uppercase tracking-widest text-ink-600">
            <span>{currentQ.section} · Frage {step+1} / {totalQuestions}</span>
            <span>{progress}%</span>
          </div>
          <div className="h-1.5 bg-champagne-100 rounded-full mt-2 overflow-hidden">
            <div className="h-full bg-ink-900 transition-all duration-300" style={{width:`${progress}%`}}></div>
          </div>
          <div className="flex gap-1.5 mt-3">
            {['Look','Hair','Beauty','Rahmen'].map((s,i)=>(
              <span key={s} className={`text-[10px] uppercase tracking-widest px-2 py-1 rounded-full ${i===sectionIdx?'bg-ink-900 text-champagne-50':i<sectionIdx?'bg-champagne-200 text-ink-700':'bg-champagne-100 text-ink-600'}`}>{s}</span>
            ))}
          </div>

          <h3 className="font-display text-3xl mt-6">{currentQ.q}</h3>
          {isMulti && <div className="text-xs text-ink-600 mt-1">Mehrfachauswahl möglich</div>}

          <div className="grid sm:grid-cols-2 gap-3 mt-6">
            {currentQ.opts.map(o=>{
              const isSel = isMulti ? selected.includes(o) : selected===o;
              return (
                <button key={o} onClick={()=> isMulti ? toggleMulti(o) : selectSingle(o)}
                  className={`p-4 rounded-2xl border text-left text-base transition flex items-center gap-3 ${isSel?'border-ink-900 bg-champagne-100':'border-champagne-200 hover:border-ink-900 hover:bg-champagne-50'}`}>
                  <span className={`w-5 h-5 rounded-full border-2 grid place-items-center flex-shrink-0 ${isSel?'border-ink-900 bg-ink-900':'border-champagne-300'}`}>
                    {isSel && <span className="text-champagne-50 text-[10px] leading-none">✓</span>}
                  </span>
                  <span>{o}</span>
                </button>
              );
            })}
          </div>

          <div className="flex justify-between items-center mt-6 text-sm gap-3">
            <button onClick={()=>step>0&&setStep(step-1)} disabled={step===0} className="text-ink-600 hover:underline disabled:opacity-30 disabled:no-underline">← Zurück</button>
            {isMulti
              ? <Button size="sm" onClick={nextMulti} disabled={!selected || selected.length===0}>{step+1>=totalQuestions?'Match anzeigen':'Weiter'}</Button>
              : null
            }
          </div>
        </Card>
      </Section>
    );
  }

  // Ergebnis-Ansicht
  const r = result;
  return (
    <Section className="py-12 max-w-4xl mx-auto">
      <div className="text-xs uppercase tracking-[0.3em] text-rose-500">Dein Feminity Beauty-Rezept</div>
      <div className="flex items-end justify-between flex-wrap gap-3 mt-2">
        <div>
          <h1 className="font-display text-5xl md:text-6xl text-ink-900">{r.lookName}</h1>
          <div className="text-ink-700 mt-2">{r.matchType.label} — {r.matchType.sub}</div>
        </div>
        <Badge tone="rose">{r.matchType.label}</Badge>
      </div>

      {pointsEarned > 0 && (
        <Card className="p-4 mt-6 bg-emerald-50 border-emerald-200 flex items-center justify-between gap-3">
          <div className="text-sm text-emerald-800"><strong>+{pointsEarned} Beauty Points</strong> — Match abgeschlossen, Bonus auf deinem Konto.</div>
          <Button size="sm" variant="ghost" onClick={()=>setView('account')}>Konto ansehen</Button>
        </Card>
      )}
      {!auth?.user && (
        <Card className="p-4 mt-6 bg-champagne-50 flex items-center justify-between gap-3 flex-wrap">
          <div className="text-sm text-ink-700">Registriere dich und erhalte <strong>+50 Beauty Points</strong> für dein Match.</div>
          <Button size="sm" variant="soft" onClick={()=>setView('register')}>Jetzt registrieren</Button>
        </Card>
      )}

      <div className="grid md:grid-cols-3 gap-5 mt-8">
        {/* Treatments */}
        <Card className="p-6 md:col-span-2">
          <h3 className="font-display text-2xl">Empfohlene Leistungen</h3>
          <div className="space-y-3 mt-4">
            {r.treatments.map(t=>(
              <div key={t.id} className="p-4 rounded-2xl bg-champagne-50">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <div className="text-xs text-ink-600">{t.cat}</div>
                    <div className="font-medium">{t.name}</div>
                    <div className="text-xs text-ink-600 mt-0.5">{minToHrs(t.duration)} · {t.fromPrice?'ab ':''}{fmt(t.price)}</div>
                  </div>
                  <div className="flex flex-col items-end gap-2 flex-shrink-0">
                    <Badge tone="success">{t.matchPct}% Match</Badge>
                    <Button size="sm" onClick={()=>setView('booking')}>Buchen</Button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="flex justify-between items-center mt-5 pt-5 border-t border-champagne-100">
            <div className="text-sm text-ink-600">Gesamtdauer · Gesamtpreis</div>
            <div className="font-display text-xl">{minToHrs(r.totalDuration)} · ab {fmt(r.totalPrice)}</div>
          </div>
        </Card>

        {/* Team-Match */}
        <Card className="p-6">
          <h3 className="font-display text-2xl">Dein Team-Match</h3>
          <div className="space-y-4 mt-4">
            {r.team.length===0 && <div className="text-ink-600 text-sm">Beliebige Stylistin im Salon.</div>}
            {r.team.map(st=>(
              <div key={st.id} className="flex items-start gap-3">
                {st.photo
                  ? <img src={st.photo} alt={st.name} className="w-14 h-14 rounded-full object-cover flex-shrink-0" />
                  : <div className="w-14 h-14 rounded-full bg-gradient-to-br from-rose-200 to-champagne-300 grid place-items-center font-display text-xl text-ink-700 flex-shrink-0">{st.name[0]}</div>}
                <div className="min-w-0">
                  <div className="font-medium">{st.name}</div>
                  <div className="text-xs text-ink-600 mb-1">{st.tag}</div>
                  <div className="text-xs text-ink-700 italic">„{r.teamReason(st)}."</div>
                </div>
              </div>
            ))}
          </div>
        </Card>

        {/* Home-Routine */}
        <Card className="p-6 md:col-span-3">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <h3 className="font-display text-2xl">{r.routine.title}</h3>
            <div className="text-xs text-ink-600 italic">Damit dein Ergebnis länger hält — nicht aggressiv, aber empfohlen.</div>
          </div>
          <div className="grid md:grid-cols-5 gap-3 mt-4">
            {r.routine.items.map((p,i)=>(
              <div key={i} className="p-4 rounded-2xl border border-champagne-200">
                <div className="text-[10px] uppercase tracking-widest text-rose-500">{p.step}</div>
                <div className="font-medium text-sm mt-1 leading-tight">{p.name}</div>
                <div className="text-xs text-ink-600 mt-1">{p.desc}</div>
              </div>
            ))}
          </div>
        </Card>
      </div>

      {/* Action Bar */}
      <Card className="p-6 mt-5 flex flex-wrap items-center gap-3 justify-between">
        <div>
          <div className="font-display text-xl">Dein nächster Schritt</div>
          <div className="text-sm text-ink-600">Buche dein Match-Paket — alle empfohlenen Leistungen, ein Termin.</div>
        </div>
        <div className="flex flex-wrap gap-2">
          <Button onClick={()=>setView('booking')}>Dieses Match buchen</Button>
          <Button variant="soft" onClick={shareWhatsApp}>Per WhatsApp teilen</Button>
          <Button variant="ghost" onClick={copyLink}>{copyHint || 'Link kopieren'}</Button>
          <Button variant="ghost" onClick={reset}>Match neu starten</Button>
        </div>
      </Card>
    </Section>
  );
}

function AccountDashboard({ setView, auth }){

  const [photoError, setPhotoError] = useState('');
  const next = nextTier(u.loyaltyPoints);
  const tierLabel = TIER_THRESHOLDS.find(t=>t.tier===u.tier)?.label || u.tier;
  const bdayStatus = birthdayBonusStatus(u.birthday);
  const canClaimBday = bdayStatus?.eligible && u.lastBirthdayBonusYear !== bdayStatus.year;

  function claimBirthdayBonus(){
    auth.updateUser({
      loyaltyPoints: u.loyaltyPoints + 50,
      lastBirthdayBonusYear: bdayStatus.year,
    });
  }

  function handlePhotoChange(e){
    const file = e.target.files?.[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ setPhotoError('Bitte eine Bilddatei wählen.'); return; }
    if(file.size > 2_000_000){ setPhotoError('Maximal 2 MB. Bitte komprimiere das Foto.'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      auth.updateUser({ photo: reader.result });
      setPhotoError('');
    };
    reader.readAsDataURL(file);
  }
  function removePhoto(){ auth.updateUser({ photo: '' }); }

  return (
    <Section className="py-12">

      <div className="flex items-center justify-between flex-wrap gap-4">

/* ============================================================
   STAFF CALENDAR
   ============================================================ */
function StaffCalendar(){
  const [day, setDay] = useState(0);
  const HOURS = Array.from({length:11}).map((_,i)=>9+i); // 09 - 19
  const dayLabels = ['Mo 27.04','Di 28.04','Mi 29.04','Do 30.04','Fr 01.05','Sa 02.05'];

  const bgFor = (area, src) => {
    if(src==='TREATWELL') return 'bg-sky-50 border-sky-300';
    if(area==='HAIR') return 'bg-champagne-100 border-champagne-300';
    return 'bg-rose-100 border-rose-300';
  };
  const toMinutes = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
  const top = t => `${(toMinutes(t)-9*60)*1.0}px`;
  const height = (s,e) => `${(toMinutes(e)-toMinutes(s))*1.0}px`;

  return (
    <Section className="py-8">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div className="text-xs uppercase tracking-[0.3em] text-ink-600">Kalender</div>
          <h1 className="font-display text-4xl text-ink-900 mt-1">Tagesansicht</h1>
        </div>
        <div className="flex flex-wrap gap-2 text-xs">
          <Badge tone="gold">Hair</Badge>
          <Badge tone="rose">Beauty</Badge>
          <Badge tone="info">Treatwell</Badge>
          <Badge>Pause</Badge>
        </div>
      </div>

      <div className="flex gap-2 mt-5 overflow-x-auto scroll-hidden pb-2">
        {dayLabels.map((d,i)=>(
          <button key={i} onClick={()=>setDay(i)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap border ${day===i?'bg-ink-900 text-champagne-50 border-ink-900':'border-champagne-200'}`}>{d}</button>
        ))}
      </div>

      <Card className="mt-5 overflow-hidden">
        <div className="grid grid-cols-[60px_1fr_1fr] border-b border-champagne-100">
          <div></div>
          <div className="p-3 text-center font-display text-lg border-l border-champagne-100">Jule · Beauty</div>
          <div className="p-3 text-center font-display text-lg border-l border-champagne-100">Nicky · Hair</div>
        </div>
        <div className="grid grid-cols-[60px_1fr_1fr] relative" style={{minHeight: HOURS.length*60+'px'}}>
          <div className="border-r border-champagne-100">
            {HOURS.map(h=>(
              <div key={h} style={{height:'60px'}} className="text-xs text-ink-600 px-2 pt-1 border-b border-champagne-100">{String(h).padStart(2,'0')}:00</div>
            ))}
          </div>
          {STAFF.map(stf=>(
            <div key={stf.id} className="relative border-r border-champagne-100">
              {HOURS.map(h=><div key={h} style={{height:'60px'}} className="border-b border-champagne-100"></div>)}
              {MOCK_BOOKINGS.filter(b=>b.staff===stf.id).map(b=>(
                <div key={b.id} className={`absolute left-1 right-1 rounded-xl border p-2 text-xs ${bgFor(b.area, b.source)}`}
                  style={{ top: top(b.start), height: height(b.start, b.end) }}>
                  <div className="font-medium truncate">{b.service}</div>
                  <div className="text-ink-700 truncate">{b.customer}</div>
                  <div className="text-[10px] text-ink-600 mt-0.5">{b.start}–{b.end} · {b.source}</div>
                  {b.status==='REQUESTED' && <div className="absolute top-1 right-1"><Badge tone="warn">angefragt</Badge></div>}
                  {b.status==='CHECKED_IN' && <div className="absolute top-1 right-1"><Badge tone="success">erschienen</Badge></div>}
                </div>
              ))}
            </div>
          ))}
        </div>
      </Card>

      <div className="grid md:grid-cols-3 gap-4 mt-5">
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Auslastung heute</div>
          <div className="font-display text-4xl mt-2">82 %</div>
          <div className="text-xs text-ink-600">6 Termine · 2 freie Slots</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Pflicht-Aufklärung offen</div>
          <div className="font-display text-4xl mt-2">1</div>
          <div className="text-xs text-amber-700">Lara K. · Green Peel · Erinnerung gesendet</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Treatwell-Sync</div>
          <div className="font-display text-4xl mt-2 text-emerald-700">OK</div>
          <div className="text-xs text-ink-600">letzter Sync vor 3 min · 0 Konflikte</div>
        </Card>
      </div>
    </Section>
  );
}
