/* ============================================================

   ============================================================ */
const Badge = ({ children, tone='neutral' }) => {
  const tones = {
    neutral:'bg-champagne-100 text-ink-800 border-champagne-200',
    rose:'bg-rose-100 text-rose-800 border-rose-200',
    gold:'bg-champagne-200 text-champagne-800 border-champagne-300',

    warn:'bg-amber-50 text-amber-800 border-amber-200',
    info:'bg-sky-50 text-sky-800 border-sky-200',
  };
  return <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs border ${tones[tone]}`}>{children}</span>;
};

const Button = ({ children, variant='primary', size='md', className='', ...rest }) => {
  const v = {
    primary:'bg-ink-900 text-champagne-50 hover:bg-ink-800',
    soft:'bg-champagne-100 text-ink-900 hover:bg-champagne-200 border border-champagne-200',
    ghost:'text-ink-900 hover:bg-champagne-100',
    rose:'bg-rose-400 text-white hover:bg-rose-500',
    outline:'border border-ink-900 text-ink-900 hover:bg-ink-900 hover:text-champagne-50',
  }[variant];
  const s = { sm:'px-3 py-1.5 text-sm', md:'px-5 py-2.5 text-sm', lg:'px-7 py-3.5 text-base' }[size];
  return <button className={`inline-flex items-center justify-center gap-2 rounded-full transition-colors font-medium ${v} ${s} ${className}`} {...rest}>{children}</button>;
};

const Card = ({ children, className='' }) => (
  <div className={`bg-white rounded-3xl border border-champagne-100 ${className}`}>{children}</div>
);

const Section = ({ children, className='' }) => (
  <section className={`max-w-7xl mx-auto px-5 md:px-8 ${className}`}>{children}</section>

/* ============================================================

   ============================================================ */

function ServicesPage({ setView, setBookingDraft }){

  const [search, setSearch] = useState('');
  const filtered = useMemo(()=>SERVICES.filter(s=>
    (filter==='ALL'||s.area===filter) &&
    (search==='' || s.name.toLowerCase().includes(search.toLowerCase()) || s.cat.toLowerCase().includes(search.toLowerCase()))
  ),[filter,search]);

  return (
    <Section className="py-12">
      <div className="text-xs uppercase tracking-[0.3em] text-ink-600">Leistungen & Preisliste</div>
      <h1 className="font-display text-5xl text-ink-900 mt-2">Treatments</h1>
      <div className="flex flex-wrap gap-3 mt-8 items-center">
        {[['ALL','Alle'],['HAIR','Hair'],['BEAUTY','Beauty']].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)}
            className={`px-4 py-2 rounded-full text-sm border ${filter===k?'bg-ink-900 text-champagne-50 border-ink-900':'border-champagne-200 text-ink-700 hover:bg-champagne-100'}`}>{l}</button>
        ))}
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suche..." className="ml-auto px-4 py-2 rounded-full border border-champagne-200 bg-white text-sm w-full md:w-72 focus:outline-none focus:border-ink-900" />
      </div>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mt-8">
        {filtered.map(s=>(
          <Card key={s.id} className="p-6 flex flex-col">
            <div className="flex items-start justify-between gap-3">
              <div>
                <div className="text-xs uppercase tracking-widest text-ink-600">{s.cat}</div>
                <h3 className="font-display text-2xl text-ink-900 mt-1">{s.name}</h3>
              </div>
              {s.signature && <Badge tone="gold">Signature</Badge>}
            </div>
            <p className="text-sm text-ink-700 mt-3 flex-1">{s.desc}</p>
            <div className="flex flex-wrap gap-2 mt-4">
              <Badge>{minToHrs(s.duration)}</Badge>
              {s.requiresForm && <Badge tone="warn">Aufklärungsbogen</Badge>}
              {s.online===false && <Badge tone="info">Beratung erforderlich</Badge>}
            </div>
            <div className="flex items-center justify-between mt-5 pt-5 border-t border-champagne-100">

/* ============================================================
   BOOKING WIZARD
   ============================================================ */
function BookingWizard({ initial, setView }){
  const [step, setStep] = useState(1);
  const [picked, setPicked] = useState(initial?.serviceId ? [initial.serviceId] : []);
  const [staff, setStaff] = useState('any');
  const [date, setDate] = useState('2026-05-04');
  const [time, setTime] = useState(null);
  const [customer, setCustomer] = useState({ name:'', email:'', phone:'' });
  const [formAccepted, setFormAccepted] = useState(false);
  const [confirmed, setConfirmed] = useState(false);

  const totalDuration = picked.reduce((a,id)=>a+(SERVICES.find(s=>s.id===id)?.duration||0),0);
  const totalPrice = picked.reduce((a,id)=>a+(SERVICES.find(s=>s.id===id)?.price||0),0);
  const hasFromPrice = picked.some(id=>SERVICES.find(s=>s.id===id)?.fromPrice);
  const requiresForm = picked.some(id=>SERVICES.find(s=>s.id===id)?.requiresForm);

  const SLOTS = ['09:00','09:30','10:00','11:30','13:00','14:00','15:30','17:00'];

  const steps = ['Leistung','Stylistin','Termin','Daten', requiresForm?'Aufklärung':null,'Zusammenfassung'].filter(Boolean);

  if(confirmed){
    return (
      <Section className="py-16">
        <Card className="max-w-2xl mx-auto p-10 text-center">
          <div className="w-16 h-16 rounded-full bg-emerald-100 grid place-items-center mx-auto text-emerald-600 text-3xl">✓</div>
          <h2 className="font-display text-4xl text-ink-900 mt-6">Buchung bestätigt</h2>
          <p className="text-ink-700 mt-3">Du erhältst gleich eine Bestätigung per E-Mail und WhatsApp. Wir freuen uns auf dich.</p>
          <Card className="mt-6 p-5 bg-champagne-50 text-left">
            <div className="font-medium">{picked.map(id=>SERVICES.find(s=>s.id===id)?.name).join(' · ')}</div>
            <div className="text-sm text-ink-700 mt-1">{date} um {time} · {staff==='any'?'beliebige Mitarbeiterin':STAFF.find(s=>s.id===staff)?.name}</div>
            <div className="text-sm text-ink-700">Dauer {minToHrs(totalDuration)} · {hasFromPrice?'ab ':''}{fmt(totalPrice)}</div>
          </Card>
          <Button className="mt-6" onClick={()=>{ setConfirmed(false); setStep(1); setView('account'); }}>Zu meinen Terminen</Button>
        </Card>
      </Section>
    );
  }

  return (
    <Section className="py-12">
      <div className="text-xs uppercase tracking-[0.3em] text-ink-600">Online-Buchung</div>
      <h1 className="font-display text-4xl md:text-5xl text-ink-900 mt-2">Termin buchen</h1>

      <div className="flex items-center gap-2 mt-6 overflow-x-auto scroll-hidden">
        {steps.map((s,i)=>(
          <div key={s} className={`flex items-center gap-2 ${i+1<=step?'text-ink-900':'text-ink-600'}`}>
            <div className={`w-7 h-7 rounded-full grid place-items-center text-xs ${i+1<step?'bg-ink-900 text-champagne-50':i+1===step?'bg-rose-400 text-white':'bg-champagne-200 text-ink-700'}`}>{i+1}</div>
            <div className="text-sm whitespace-nowrap">{s}</div>
            {i<steps.length-1 && <div className="w-8 h-px bg-champagne-200"></div>}
          </div>
        ))}
      </div>

      <div className="grid md:grid-cols-3 gap-6 mt-8">
        <div className="md:col-span-2 space-y-6">
          {step===1 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Wähle deine Leistung(en)</h3>
              <div className="space-y-3">
                {SERVICES.filter(s=>s.online!==false).map(s=>{
                  const on = picked.includes(s.id);
                  return (
                    <button key={s.id} onClick={()=>setPicked(p=>on?p.filter(x=>x!==s.id):[...p,s.id])}
                      className={`w-full text-left p-4 rounded-2xl border transition ${on?'border-ink-900 bg-champagne-100':'border-champagne-200 hover:border-champagne-300'}`}>
                      <div className="flex items-center justify-between gap-3">
                        <div>
                          <div className="text-xs uppercase tracking-widest text-ink-600">{s.cat}</div>
                          <div className="font-medium mt-1">{s.name}</div>
                          <div className="text-xs text-ink-600 mt-0.5">{minToHrs(s.duration)}</div>
                        </div>
                        <div className="text-right">
                          <div className="font-display text-xl">{s.fromPrice?'ab ':''}{fmt(s.price)}</div>
                          <div className={`mt-1 w-5 h-5 rounded-full border-2 ${on?'bg-ink-900 border-ink-900':'border-champagne-300'}`}></div>
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </Card>
          )}

          {step===2 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Wähle deine Stylistin</h3>
              <div className="grid sm:grid-cols-3 gap-3">
                <button onClick={()=>setStaff('any')} className={`p-4 rounded-2xl border text-left ${staff==='any'?'border-ink-900 bg-champagne-100':'border-champagne-200'}`}>
                  <div className="w-12 h-12 rounded-full bg-gradient-to-br from-rose-200 to-champagne-300 mb-3"></div>
                  <div className="font-medium">Beliebige Stylistin</div>
                  <div className="text-xs text-ink-600 mt-1">Schnellster Termin verfügbar</div>
                </button>
                {STAFF.map(s=>{
                  const qualified = picked.length===0 || picked.every(pid=>SERVICES.find(sv=>sv.id===pid)?.staff.includes(s.id));
                  return (
                    <button key={s.id} disabled={!qualified} onClick={()=>setStaff(s.id)}
                      className={`p-4 rounded-2xl border text-left transition ${staff===s.id?'border-ink-900 bg-champagne-100':'border-champagne-200'} ${!qualified?'opacity-40 cursor-not-allowed':''}`}>
                      <div className="w-12 h-12 rounded-full bg-gradient-to-br from-rose-300 to-champagne-400 mb-3"></div>
                      <div className="font-medium">{s.name}</div>
                      <div className="text-xs text-ink-600 mt-1">{s.lead} Lead</div>
                      {!qualified && <div className="text-xs text-amber-700 mt-1">Erbringt diese Leistung nicht</div>}
                    </button>
                  );
                })}
              </div>
            </Card>
          )}

          {step===3 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Datum und Uhrzeit</h3>
              <div className="flex gap-2 overflow-x-auto scroll-hidden pb-2">
                {Array.from({length:14}).map((_,i)=>{
                  const d = new Date(2026,4,1+i);
                  const iso = d.toISOString().slice(0,10);
                  const lbl = d.toLocaleDateString('de-DE',{weekday:'short', day:'2-digit', month:'short'});
                  return (
                    <button key={iso} onClick={()=>setDate(iso)} className={`px-4 py-3 rounded-2xl border text-sm whitespace-nowrap ${date===iso?'border-ink-900 bg-ink-900 text-champagne-50':'border-champagne-200'}`}>{lbl}</button>
                  );
                })}
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-5">
                {SLOTS.map(t=>(
                  <button key={t} onClick={()=>setTime(t)} className={`px-3 py-2.5 rounded-xl border text-sm ${time===t?'border-ink-900 bg-ink-900 text-champagne-50':'border-champagne-200 hover:bg-champagne-100'}`}>{t}</button>
                ))}
              </div>
              <div className="text-xs text-ink-600 mt-4">Verfügbarkeit synchronisiert mit Treatwell und internem Kalender.</div>
            </Card>
          )}

          {step===4 && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Deine Daten</h3>
              <div className="space-y-3">
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="Name" value={customer.name} onChange={e=>setCustomer({...customer,name:e.target.value})} />
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="E-Mail" type="email" value={customer.email} onChange={e=>setCustomer({...customer,email:e.target.value})} />
                <input className="w-full px-4 py-3 rounded-xl border border-champagne-200 bg-white" placeholder="Telefon (für WhatsApp-Erinnerung)" value={customer.phone} onChange={e=>setCustomer({...customer,phone:e.target.value})} />
                <label className="flex items-start gap-2 text-sm text-ink-700 mt-3">
                  <input type="checkbox" className="mt-1" required /> Ich akzeptiere Datenschutzerklärung und AGB.
                </label>
                <label className="flex items-start gap-2 text-sm text-ink-700">
                  <input type="checkbox" className="mt-1" /> Ich möchte WhatsApp-Erinnerungen erhalten.
                </label>
              </div>
            </Card>
          )}

          {step===5 && requiresForm && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-2">Aufklärungsbogen</h3>
              <p className="text-sm text-ink-700">Für die gewählte Leistung ist eine Aufklärung erforderlich. Bitte beantworte die folgenden Fragen vor deinem Termin.</p>
              <div className="mt-5 space-y-4">
                {[
                  'Hast du bekannte Allergien gegen kosmetische Wirkstoffe?',
                  'Bist du aktuell schwanger oder stillst du?',
                  'Hattest du in den letzten 6 Monaten eine Henna-Behandlung?',
                  'Nimmst du blutverdünnende Medikamente?'
                ].map((q,i)=>(
                  <div key={i} className="p-4 rounded-2xl bg-champagne-50">
                    <div className="text-sm font-medium">{q}</div>
                    <div className="flex gap-2 mt-2">
                      <button className="px-4 py-1.5 rounded-full text-xs bg-white border border-champagne-200">Ja</button>
                      <button className="px-4 py-1.5 rounded-full text-xs bg-white border border-champagne-200">Nein</button>
                    </div>
                  </div>
                ))}
                <div className="p-4 rounded-2xl border-2 border-dashed border-champagne-300 text-center text-sm text-ink-600">
                  Hier digital unterschreiben
                </div>
                <label className="flex items-start gap-2 text-sm">
                  <input type="checkbox" className="mt-1" checked={formAccepted} onChange={e=>setFormAccepted(e.target.checked)} />
                  Ich bestätige die wahrheitsgemäße Beantwortung und stimme der Behandlung zu.
                </label>
              </div>
            </Card>
          )}

          {step===steps.length && (
            <Card className="p-6">
              <h3 className="font-display text-2xl mb-4">Zusammenfassung</h3>
              <div className="space-y-3 text-sm">
                <Row label="Leistung" value={picked.map(id=>SERVICES.find(s=>s.id===id)?.name).join(', ')} />
                <Row label="Stylistin" value={staff==='any'?'beliebige':STAFF.find(s=>s.id===staff)?.name} />
                <Row label="Datum" value={`${date} um ${time||'—'}`} />
                <Row label="Dauer" value={minToHrs(totalDuration)} />
                <Row label="Aufklärungsbogen" value={requiresForm?(formAccepted?'unterzeichnet':'fehlt'):'—'} />
                <div className="border-t border-champagne-200 pt-3 flex items-center justify-between">
                  <div className="font-medium">Gesamt</div>
                  <div className="font-display text-2xl">{hasFromPrice?'ab ':''}{fmt(totalPrice)}</div>
                </div>
              </div>
            </Card>
          )}

          <div className="flex justify-between">
            <Button variant="ghost" onClick={()=>step>1?setStep(step-1):setView('services')}>Zurück</Button>
            {step<steps.length ? (
              <Button onClick={()=>setStep(step+1)} disabled={
                (step===1 && picked.length===0) ||
                (step===3 && !time) ||
                (step===4 && (!customer.name||!customer.email)) ||
                (step===5 && requiresForm && !formAccepted)
              }>Weiter</Button>
            ) : (
              <Button variant="rose" onClick={()=>setConfirmed(true)}>Verbindlich buchen</Button>
            )}
          </div>
        </div>

        <aside className="md:sticky md:top-24 self-start">
          <Card className="p-6">
            <div className="text-xs uppercase tracking-widest text-ink-600">Deine Auswahl</div>
            {picked.length===0 && <p className="text-sm text-ink-600 mt-3">Noch keine Leistung gewählt.</p>}
            <div className="space-y-2 mt-3">
              {picked.map(id=>{ const s=SERVICES.find(s=>s.id===id); return (
                <div key={id} className="flex justify-between text-sm">
                  <span>{s.name}</span><span className="text-ink-600">{minToHrs(s.duration)}</span>
                </div>
              ); })}
            </div>
            {picked.length>0 && (
              <div className="border-t border-champagne-100 mt-4 pt-4 text-sm">
                <div className="flex justify-between"><span>Dauer</span><span>{minToHrs(totalDuration)}</span></div>
                <div className="flex justify-between mt-1"><span>Gesamt</span><span className="font-display text-lg">{hasFromPrice?'ab ':''}{fmt(totalPrice)}</span></div>
              </div>
            )}
          </Card>
        </aside>
      </div>
    </Section>
  );
}

/* ============================================================
   BEAUTY MATCH (Quiz)
   ============================================================ */
function BeautyMatch({ setView }){
  const QUESTIONS = [
    { q:'Was steht im Vordergrund?', opts:['Hair','Skin','Make-up','Komplettverwandlung'] },
    { q:'Wie viel Zeit hast du?', opts:['unter 1 h','1–2 h','2–4 h','flexibel'] },
    { q:'Anlass?', opts:['Alltag','Event / Hochzeit','Selbstpflege','Beratung'] },
    { q:'Hauttyp?', opts:['trocken','normal','Mischhaut','sensibel'] },
    { q:'Budget?', opts:['bis 100 €','100–250 €','250–500 €','offen'] },
    { q:'Wie oft kommst du zu uns?', opts:['Erstmals','selten','regelmäßig','VIP'] },
  ];
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const done = step===QUESTIONS.length;

  const recommendation = useMemo(()=>{
    const a = answers[0];
    if(a==='Hair') return SERVICES.filter(s=>s.area==='HAIR').slice(0,3);
    if(a==='Skin') return [SERVICES.find(s=>s.id==='svc-greenpeel'), SERVICES.find(s=>s.id==='svc-skin'), SERVICES.find(s=>s.id==='svc-consult')];
    if(a==='Make-up') return [SERVICES.find(s=>s.id==='svc-makeup'), SERVICES.find(s=>s.id==='svc-pmu'), SERVICES.find(s=>s.id==='svc-consult')];
    return SERVICES.filter(s=>s.signature).slice(0,3);
  },[answers]);

  return (
    <Section className="py-12 max-w-3xl mx-auto">
      <div className="text-xs uppercase tracking-[0.3em] text-rose-500">Beauty Match</div>
      <h1 className="font-display text-5xl text-ink-900 mt-2">Finde dein Treatment</h1>

      {!done && (
        <Card className="p-8 mt-8">
          <div className="text-xs uppercase tracking-widest text-ink-600">Frage {step+1} von {QUESTIONS.length}</div>
          <h3 className="font-display text-3xl mt-3">{QUESTIONS[step].q}</h3>
          <div className="grid sm:grid-cols-2 gap-3 mt-6">
            {QUESTIONS[step].opts.map(o=>(
              <button key={o} onClick={()=>{ setAnswers({...answers,[step]:o}); setStep(step+1); }}
                className="p-4 rounded-2xl border border-champagne-200 hover:border-ink-900 hover:bg-champagne-100 text-left text-base transition">{o}</button>
            ))}
          </div>
          <div className="flex justify-between mt-6 text-sm">
            <button onClick={()=>step>0&&setStep(step-1)} className="text-ink-600 hover:underline">Zurück</button>
            <div className="text-ink-600">{Object.keys(answers).length} / {QUESTIONS.length}</div>
          </div>
        </Card>
      )}

      {done && (
        <Card className="p-8 mt-8">
          <div className="text-xs uppercase tracking-widest text-ink-600">Deine Empfehlung</div>
          <h3 className="font-display text-3xl mt-2">Das passt zu dir</h3>
          <div className="space-y-3 mt-6">
            {recommendation.filter(Boolean).map(s=>(
              <div key={s.id} className="flex items-center justify-between p-4 rounded-2xl bg-champagne-50">
                <div>
                  <div className="text-xs text-ink-600">{s.cat}</div>
                  <div className="font-medium">{s.name}</div>
                  <div className="text-xs text-ink-600 mt-0.5">{minToHrs(s.duration)} · {s.fromPrice?'ab ':''}{fmt(s.price)}</div>
                </div>
                <Button size="sm" onClick={()=>setView('booking')}>Buchen</Button>
              </div>
            ))}
          </div>
          <div className="flex gap-3 mt-6">
            <Button variant="soft" onClick={()=>{setAnswers({}); setStep(0);}}>Noch einmal</Button>
            <Button variant="ghost" onClick={()=>setView('services')}>Alle Leistungen ansehen</Button>
          </div>
        </Card>
      )}
    </Section>
  );
}

/* ============================================================
   STAFF CALENDAR
   ============================================================ */
function StaffCalendar(){
  const [day, setDay] = useState(0);
  const HOURS = Array.from({length:11}).map((_,i)=>9+i); // 09 - 19
  const dayLabels = ['Mo 27.04','Di 28.04','Mi 29.04','Do 30.04','Fr 01.05','Sa 02.05'];

  const bgFor = (area, src) => {
    if(src==='TREATWELL') return 'bg-sky-50 border-sky-300';
    if(area==='HAIR') return 'bg-champagne-100 border-champagne-300';
    return 'bg-rose-100 border-rose-300';
  };
  const toMinutes = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
  const top = t => `${(toMinutes(t)-9*60)*1.0}px`;
  const height = (s,e) => `${(toMinutes(e)-toMinutes(s))*1.0}px`;

  return (
    <Section className="py-8">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <div className="text-xs uppercase tracking-[0.3em] text-ink-600">Kalender</div>
          <h1 className="font-display text-4xl text-ink-900 mt-1">Tagesansicht</h1>
        </div>
        <div className="flex flex-wrap gap-2 text-xs">
          <Badge tone="gold">Hair</Badge>
          <Badge tone="rose">Beauty</Badge>
          <Badge tone="info">Treatwell</Badge>
          <Badge>Pause</Badge>
        </div>
      </div>

      <div className="flex gap-2 mt-5 overflow-x-auto scroll-hidden pb-2">
        {dayLabels.map((d,i)=>(
          <button key={i} onClick={()=>setDay(i)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap border ${day===i?'bg-ink-900 text-champagne-50 border-ink-900':'border-champagne-200'}`}>{d}</button>
        ))}
      </div>

      <Card className="mt-5 overflow-hidden">
        <div className="grid grid-cols-[60px_1fr_1fr] border-b border-champagne-100">
          <div></div>
          <div className="p-3 text-center font-display text-lg border-l border-champagne-100">Jule · Beauty</div>
          <div className="p-3 text-center font-display text-lg border-l border-champagne-100">Nicky · Hair</div>
        </div>
        <div className="grid grid-cols-[60px_1fr_1fr] relative" style={{minHeight: HOURS.length*60+'px'}}>
          <div className="border-r border-champagne-100">
            {HOURS.map(h=>(
              <div key={h} style={{height:'60px'}} className="text-xs text-ink-600 px-2 pt-1 border-b border-champagne-100">{String(h).padStart(2,'0')}:00</div>
            ))}
          </div>
          {STAFF.map(stf=>(
            <div key={stf.id} className="relative border-r border-champagne-100">
              {HOURS.map(h=><div key={h} style={{height:'60px'}} className="border-b border-champagne-100"></div>)}
              {MOCK_BOOKINGS.filter(b=>b.staff===stf.id).map(b=>(
                <div key={b.id} className={`absolute left-1 right-1 rounded-xl border p-2 text-xs ${bgFor(b.area, b.source)}`}
                  style={{ top: top(b.start), height: height(b.start, b.end) }}>
                  <div className="font-medium truncate">{b.service}</div>
                  <div className="text-ink-700 truncate">{b.customer}</div>
                  <div className="text-[10px] text-ink-600 mt-0.5">{b.start}–{b.end} · {b.source}</div>
                  {b.status==='REQUESTED' && <div className="absolute top-1 right-1"><Badge tone="warn">angefragt</Badge></div>}
                  {b.status==='CHECKED_IN' && <div className="absolute top-1 right-1"><Badge tone="success">erschienen</Badge></div>}
                </div>
              ))}
            </div>
          ))}
        </div>
      </Card>

      <div className="grid md:grid-cols-3 gap-4 mt-5">
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Auslastung heute</div>
          <div className="font-display text-4xl mt-2">82 %</div>
          <div className="text-xs text-ink-600">6 Termine · 2 freie Slots</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Pflicht-Aufklärung offen</div>
          <div className="font-display text-4xl mt-2">1</div>
          <div className="text-xs text-amber-700">Lara K. · Green Peel · Erinnerung gesendet</div>
        </Card>
        <Card className="p-5">
          <div className="text-xs uppercase tracking-widest text-ink-600">Treatwell-Sync</div>
          <div className="font-display text-4xl mt-2 text-emerald-700">OK</div>
          <div className="text-xs text-ink-600">letzter Sync vor 3 min · 0 Konflikte</div>
        </Card>
      </div>
    </Section>
  );
}
